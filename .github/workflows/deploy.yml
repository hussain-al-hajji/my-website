name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # بناء يومي ليختفي الخبر أو الإعلان المنتهي دون تدخل
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# لا يُلغى بناء جارٍ عند وصول تعديل جديد (كان يُلغى فيضيع نشر أحدهما)؛ يُكمل الجاري ثم يعمل الأحدث وحده فيشمل كل ما قبله
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # البناء اليومي واليدوي يعملان على الفرع الافتراضي للمستودع، فيُبنى منه main صراحةً حتى لا يرجع الموقع لنسخة أقدم
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # الدومين من ملف public/CNAME: إن وُجد يُبنى الموقع عليه من الجذر، وإلا يُنشر على github.io/my-website
      - id: site
        run: |
          d=$(tr -d '[:space:]' < public/CNAME 2>/dev/null || true)
          if [ -n "$d" ]; then u="https://$d"; b="/"; else u="https://hussain-al-hajji.github.io"; b="/my-website"; fi
          echo "u=$u" >> "$GITHUB_OUTPUT"; echo "b=$b" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.site.outputs.u }}
          SITE_BASE: ${{ vars.SITE_BASE || steps.site.outputs.b }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # فشل البناء أو النشر لا يمرّ بصمت: يُفتح بلاغ في المستودع (يصلك إشعار GitHub) برابط التشغيل الفاشل
  alert:
    needs: [build, deploy]
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "فشل نشر الموقع: التحديثات الأخيرة لم تظهر بعد" \
            --body "فشل بناء الموقع أو نشره بعد آخر تعديل، فبقي المنشور على النسخة السابقة. تفاصيل الخطأ: $RUN_URL"
